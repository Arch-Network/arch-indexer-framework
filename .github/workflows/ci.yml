name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCH_INDEXER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/arch_indexer_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arch_indexer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arch_indexer_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # The Postgres-backed tests are #[ignore] so a bare `cargo test` passes
      # without a database; this job has one.
      - name: Test
        run: cargo test --workspace --locked -- --include-ignored
