[workspace]
resolver = "2"
members = ["crates/arch-indexer-core", "crates/arch-indexer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Arch-Network/arch-indexer-framework"
homepage = "https://github.com/Arch-Network/arch-indexer-framework"
readme = "README.md"

[workspace.dependencies]
arch-indexer-core = { version = "0.1.0", path = "crates/arch-indexer-core" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
